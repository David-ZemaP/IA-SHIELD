<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🚫 URL Bloqueada — IA Seguridad</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 16px;
      max-width: 500px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      text-align: center;
    }
    .icon {
      font-size: 64px;
      margin-bottom: 20px;
    }
    h1 {
      color: #dc3545;
      font-size: 24px;
      margin-bottom: 16px;
    }
    .subtitle {
      color: #666;
      font-size: 16px;
      margin-bottom: 24px;
    }
    .details {
      background: #f8f9fa;
      border-radius: 8px;
      padding: 20px;
      text-align: left;
      margin-bottom: 24px;
    }
    .details p {
      margin: 8px 0;
      font-size: 14px;
    }
    .details strong {
      color: #333;
    }
    .url {
      word-break: break-all;
      font-family: monospace;
      font-size: 12px;
      background: #fff;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #ddd;
    }
    .threat-type {
      display: inline-block;
      background: #dc3545;
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    button {
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #0d6efd;
      color: white;
    }
    .btn-primary:hover {
      background: #0b5ed7;
    }
    .btn-secondary {
      background: #6c757d;
      color: white;
    }
    .btn-secondary:hover {
      background: #5a6268;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🛡️</div>
    <h1>URL Bloqueada</h1>
    <p class="subtitle">IA Seguridad detectó una amenaza potencial</p>

    <div class="details">
      <p><strong>Tipo de amenaza:</strong> <span id="threatType" class="threat-type">CARGANDO...</span></p>
      <p><strong>Dominio:</strong> <span id="domain">Cargando...</span></p>
      <p><strong>URL:</strong></p>
      <div id="url" class="url">Cargando...</div>
    </div>

    <div class="buttons">
      <button class="btn-primary" onclick="goBack()">⬅️ Volver al correo</button>
      <button class="btn-secondary" onclick="reportFalsePositive()">⚠️ Reportar falso positivo</button>
      <button class="btn-warning" style="background:#ffc107;color:#000;" onclick="proceedAnyway()">⚡ Entiendo, continuar</button>
    </div>
  </div>

  <script>
    // Parse URL parameters
    const params = new URLSearchParams(window.location.search);
    document.getElementById('threatType').textContent = params.get('threat') || 'DESCONOCIDO';
    document.getElementById('domain').textContent = params.get('domain') || 'Desconocido';
    document.getElementById('url').textContent = params.get('url') || '';

    function goBack() {
      window.history.back();
    }

    function reportFalsePositive() {
      const url = params.get('url');
      const domain = params.get('domain');

      // Remove from blocked list
      chrome.storage.local.get('ia_seguridad_blocked_domains').then(stored => {
        const blocked = stored.ia_seguridad_blocked_domains || [];
        const updated = blocked.filter(d => d !== domain);
        chrome.storage.local.set({ ia_seguridad_blocked_domains: updated });

        alert('Dominio removido de la lista de bloqueados. Por favor reporta este falso positivo en el dashboard.');
      });
    }

    function proceedAnyway() {
      const url = params.get('url');
      if (url) {
        if (confirm('¿Estás seguro? Esta URL fue marcada como sospechosa. Continuarás bajo tu propio riesgo.')) {
          window.location.href = url;
        }
      }
    }
  </script>
</body>
</html>
